<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e7c6b">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{--teal:#0e7c6b;--teal-d:#0a5f52;--teal-s:#e4f3ef;--gold:#d4a017;--gold-s:#fbf3dd;--gold-t:#8a6d1a;--red:#b91c1c;--red-s:#fde8e8;--green:#166534;--green-s:#e3f4e6;--line:#e2e8f0;--text:#0f172a;--muted:#596779;--bg:#f4f6fa}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header.top{background:linear-gradient(135deg,#0e7c6b,#129682);color:#fff;padding:20px 20px 18px}
header.top .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
header.top h1{margin:0;font-size:22px}
header.top p{margin:4px 0 0;font-size:13px;color:#e4f3ef}
.badge{font-size:12px;font-weight:700;color:var(--teal-d);background:#fde047;border-radius:999px;padding:4px 10px;white-space:nowrap}
main{flex:1;padding:16px 20px 96px;display:flex;flex-direction:column;gap:12px}
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px 0 12px}
nav.bottom button{border:0;background:none;min-height:48px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
nav.bottom button.on{color:var(--teal);font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.click{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.card.warn{border-left:4px solid var(--gold)}
.title{margin:0;font-size:16px;font-weight:700}
.sub{margin:0;font-size:13px;color:var(--muted)}
.body{margin:0;font-size:14px;line-height:1.45}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.p-wait{background:var(--gold-s);color:var(--gold-t)}.p-late{background:var(--red-s);color:var(--red)}
.p-ok{background:var(--green-s);color:var(--green)}.p-info{background:var(--teal-s);color:var(--teal-d)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;min-height:44px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
label{font-size:13px;font-weight:600;color:#334155}
input,select,textarea{width:100%;border:1px solid #8a99ab;border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;background:#fff;color:var(--text)}
.f{display:flex;flex-direction:column;gap:6px}
.btn{min-height:52px;border:0;border-radius:14px;background:var(--teal);color:#fff;font-size:16px;font-weight:700;cursor:pointer;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.sec{background:#fff;color:var(--teal);border:1px dashed var(--teal);font-size:14px;min-height:48px}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px}
.btn.wa{background:#fff;color:#166534;border:1px solid #166534;font-size:14px;min-height:44px;border-radius:12px}
.btn:disabled{opacity:.6}
.link{border:0;background:none;color:#fff;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;padding:0 6px;text-decoration:underline}
.linkd{border:0;background:none;color:var(--teal);font-size:14px;font-weight:600;cursor:pointer;min-height:44px;padding:0;text-decoration:underline;text-align:left}
.back{border:0;background:none;color:#fff;font-size:15px;font-weight:600;cursor:pointer;min-height:44px;padding:0;margin-left:-4px}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:0 14px;font-size:14px}
.opt input{width:20px;height:20px;accent-color:var(--teal)}
.opt.sel{border:2px solid var(--teal)}
.info{background:var(--teal-s);color:var(--teal-d);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;margin:0}
.err{background:var(--red-s);color:var(--red);border-radius:12px;padding:10px 14px;font-size:14px}
.ok{background:var(--green-s);color:var(--green);border-radius:12px;padding:10px 14px;font-size:14px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .n{font-size:28px;font-weight:700;color:var(--teal);margin:0}
.bar{height:10px;border-radius:999px;background:var(--line)}.bar>div{height:10px;border-radius:999px}
.login{background:linear-gradient(135deg,#0e7c6b,#129682);padding:64px 24px 88px;border-radius:0 0 32px 32px;color:#fff}
.login h1{margin:12px 0 4px;font-size:28px;letter-spacing:.5px}.login p{margin:0;font-weight:700;color:#fde047}
.loginform{margin:-48px 20px 0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
.loginform h2{margin:0;font-size:20px}
.foot{font-size:13px;color:var(--muted);text-align:center;margin:20px 28px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* dokumen cetak */
.doc{background:#fff;color:#000;font-size:13px;line-height:1.4;gap:10px}
.doc h2{margin:0;font-size:15px;text-align:center}
.doc table{width:100%;border-collapse:collapse}
.doc th,.doc td{border:1px solid #000;padding:5px 6px;text-align:left;vertical-align:top;font-size:12px}
.doc .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.doc .ttd{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:20px;text-align:center}
.doc .ttd div{padding-top:48px;border-bottom:0}
.doc .ttd span{display:block;border-top:1px solid #000;padding-top:4px}
.pb{page-break-before:always}
@media print{
  body{background:#fff}#app{max-width:none;background:#fff}
  header.top,nav.bottom,.noprint{display:none!important}
  main{padding:0}main.doc{padding:0}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ====== Project Supabase ======
var SUPABASE_URL = 'https://pjnnyrajzbcvuodjwjcw.supabase.co';
var SUPABASE_KEY = 'sb_publishable_ZU8cKP94_i0uxg_wl5BdIw_kJRqe1-u';
// ==============================

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var app = document.getElementById('app');
var S = { me: null, tab: null, filter: 'semua', dpjps: [], pasienId: null, temuanId: null, view: 'list', prefill: null, ckTgl: hariIni(), recovery: /type=recovery/.test(location.hash) };

var CHECK = [
 'Identitas pasien dan nomor rekam medis sesuai',
 'SEP/eligibilitas dan episode pelayanan sesuai',
 'DPJP dan tanggal pelayanan tercatat',
 'Asesmen awal dan CPPT terkini tersedia serta autentik',
 'Diagnosis utama/sekunder dan perkembangan klinis terdokumentasi',
 'Komorbid/komplikasi memiliki bukti dan dokumentasi yang relevan',
 'Tindakan/prosedur memiliki laporan dan autentikasi yang sesuai',
 'Hasil penunjang relevan tersedia dan dapat ditelusuri',
 'Obat, alat kesehatan, ICU/ventilator, transfusi, dan layanan khusus tercatat bila diberikan',
 'Resume medis/ringkasan sementara dan rencana pulang ditindaklanjuti',
 'Gap dicatat pada Form Monitoring Durante dengan PIC dan target',
 'Status tindak lanjut dan hasil verifikasi ulang tercatat'
];
var JAWABAN = { sudah_diperbaiki:'Sudah diperbaiki di RME', tidak_sesuai:'Tidak sesuai, dijelaskan', diskusi_langsung:'Perlu diskusi langsung' };
var VAPID_PUBLIC = 'BGN6ERcWhp62dGrR8lym20RiPL5yFAPGhPp1P7ZkGScQMf2ksTq0QdF3MWWlH6sgFgXu_Uam1xhEOBsbDUCZjqc';
var ROLE = { admin:'Admin', casemix:'Dokter Casemix', dpjp:'DPJP' };

function hariIni(){ var d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function tgl(t){ if(!t) return '-'; return new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function tglD(d){ if(!d) return '-'; return new Date(d + 'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}); }
function terlambat(t){ return t.status === 'menunggu' && t.target && new Date(t.target) < new Date(); }
function pillTemuan(t){
  if (t.status === 'selesai') return '<span class="pill p-ok">Selesai</span>';
  if (t.status === 'dijawab') return '<span class="pill p-info">Sudah dijawab</span>';
  if (terlambat(t)) return '<span class="pill p-late">Terlambat</span>';
  return '<span class="pill p-wait">Menunggu DPJP</span>';
}
function waLink(nomor, nama){
  var n = String(nomor || '').replace(/\D/g, '');
  if (!n) return '';
  if (n.charAt(0) === '0') n = '62' + n.slice(1); else if (n.charAt(0) === '8') n = '62' + n;
  var teks = 'Selamat siang ' + (nama || 'dokter') + ', ada klarifikasi casemix yang menunggu jawaban di aplikasi Visite Casemix. Mohon dibuka: ' + location.origin + location.pathname;
  return 'https://wa.me/' + n + '?text=' + encodeURIComponent(teks);
}
function waBtn(pic){
  if (!pic) return '';
  var l = waLink(pic.wa_nomor, pic.nama);
  return l ? '<a class="btn wa" href="' + l + '" target="_blank" rel="noopener">Ingatkan lewat WhatsApp</a>' : '<p class="sub">Nomor WhatsApp DPJP belum diisi.</p>';
}


// ---------- Notifikasi (web push) ----------
function b64ToU8(b){ var p = '='.repeat((4 - b.length % 4) % 4); var r = atob((b + p).replace(/-/g,'+').replace(/_/g,'/')), o = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) o[i] = r.charCodeAt(i); return o; }
function pushBisa(){ return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window) && location.protocol.indexOf('http') === 0; }
async function swReg(){ if (!pushBisa()) return null; try { return await navigator.serviceWorker.ready; } catch (e) { return null; } }
async function statusPush(){
  if (!pushBisa()) return 'tidak_didukung';
  if (Notification.permission === 'denied') return 'diblokir';
  var reg = await swReg(); if (!reg) return 'tidak_didukung';
  var sub = await reg.pushManager.getSubscription();
  return sub && Notification.permission === 'granted' ? 'aktif' : 'mati';
}
async function simpanLangganan(sub){
  var j = sub.toJSON();
  return sb.from('push_langganan').upsert({ user_id: S.me.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: 'endpoint' });
}
async function aktifkanPush(){
  var izin = await Notification.requestPermission();
  if (izin !== 'granted') return 'Izin notifikasi tidak diberikan.';
  var reg = await swReg(); if (!reg) return 'Browser ini belum mendukung notifikasi.';
  var sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUBLIC) });
  var x = await simpanLangganan(sub);
  return x.error ? 'Gagal menyimpan: ' + x.error.message : null;
}
async function matikanPush(){
  var reg = await swReg(); var sub = reg && await reg.pushManager.getSubscription();
  if (sub){ await sb.from('push_langganan').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
}
async function sinkronPush(){
  try { if (await statusPush() === 'aktif'){ var reg = await swReg(); var sub = await reg.pushManager.getSubscription(); if (sub) await simpanLangganan(sub); } } catch (e) {}
}
async function lepasPushLokal(){
  try { var reg = await swReg(); var sub = reg && await reg.pushManager.getSubscription(); if (sub) await sb.from('push_langganan').delete().eq('endpoint', sub.endpoint); } catch (e) {}
}
if (pushBisa()) navigator.serviceWorker.register('sw.js').catch(function(){});

function header(judul, sub, back){
  return '<header class="top"><div class="row">' +
    (back ? '<button class="back" data-act="back">&larr; Kembali</button>' : '<h1>' + esc(judul) + '</h1>') +
    '<span><span class="badge">' + esc(ROLE[S.me.role] || '') + '</span> ' +
    '<button class="link" data-act="keluar">Keluar</button></span></div>' +
    (back ? '<h1 style="margin-top:6px">' + esc(judul) + '</h1>' : '') +
    (sub ? '<p>' + esc(sub) + '</p>' : '') + '</header>';
}
function nav(items){
  return '<nav class="bottom" aria-label="Menu utama">' + items.map(function(i){
    return '<button data-tab="' + i[0] + '" class="' + (S.tab === i[0] ? 'on' : '') + '"' + (S.tab === i[0] ? ' aria-current="page"' : '') + '>' + i[1] + '</button>';
  }).join('') + '</nav>';
}
function menu(){
  return S.me.role === 'dpjp' ? nav([['klar','Klarifikasi'],['riwayat','Riwayat'],['akun','Akun']])
    : nav([['pasien','Pasien'],['klar','Klarifikasi'],['rekap','Rekap'],['akun','Akun']]);
}
function shell(head, inner, navHtml){ app.innerHTML = head + '<main>' + inner + '</main>' + (navHtml || ''); }

// ---------- Login, lupa sandi ----------
function showLogin(msg, ok){
  app.innerHTML = '<div class="login"><h1>VISITE CASEMIX</h1><p>RSUD Umar Wirahadikusumah</p></div>' +
    '<form class="loginform" id="lf"><h2>Masuk</h2>' + (msg ? '<div class="' + (ok ? 'ok' : 'err') + '" role="alert">' + esc(msg) + '</div>' : '') +
    '<div class="f"><label for="em">Email RS</label><input id="em" type="email" autocomplete="username" required></div>' +
    '<div class="f"><label for="pw">Kata sandi</label><input id="pw" type="password" autocomplete="current-password"></div>' +
    '<button class="btn" type="submit">Masuk</button>' +
    '<button class="linkd" type="button" id="lupa">Lupa kata sandi?</button>' +
    '<p class="sub">Gunakan akun pribadi Anda. Tidak ada akun bersama.</p></form>' +
    '<p class="foot">Setiap akses dan perubahan dicatat dalam riwayat perubahan.</p>';
  document.getElementById('lf').onsubmit = async function(e){
    e.preventDefault();
    var r = await sb.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value });
    if (r.error) return showLogin('Email atau kata sandi salah.');
    start();
  };
  document.getElementById('lupa').onclick = async function(){
    var em = document.getElementById('em').value.trim();
    if (!em) return showLogin('Isi email Anda dulu, lalu tekan "Lupa kata sandi?".');
    var r = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
    if (r.error) return showLogin('Gagal mengirim: ' + r.error.message);
    showLogin('Jika email terdaftar, tautan untuk membuat kata sandi baru sudah dikirim. Cek kotak masuk dan folder spam.', true);
  };
}
function showSetPassword(msg){
  app.innerHTML = '<div class="login"><h1>VISITE CASEMIX</h1><p>RSUD Umar Wirahadikusumah</p></div>' +
    '<form class="loginform" id="np"><h2>Buat kata sandi baru</h2>' + (msg ? '<div class="err" role="alert">' + esc(msg) + '</div>' : '') +
    '<div class="f"><label for="n1">Kata sandi baru (minimal 8 karakter)</label><input id="n1" type="password" autocomplete="new-password" required minlength="8"></div>' +
    '<button class="btn" type="submit">Simpan</button></form>';
  document.getElementById('np').onsubmit = async function(e){
    e.preventDefault();
    var r = await sb.auth.updateUser({ password: document.getElementById('n1').value });
    if (r.error) return showSetPassword('Gagal: ' + r.error.message);
    S.recovery = false; history.replaceState(null, '', location.pathname); start();
  };
}
sb.auth.onAuthStateChange(function(ev){ if (ev === 'PASSWORD_RECOVERY'){ S.recovery = true; showSetPassword(); } });

// ---------- Mulai ----------
async function start(){
  var s = await sb.auth.getSession();
  if (S.recovery && s.data.session) return showSetPassword();
  if (!s.data.session) return showLogin();
  var p = await sb.from('profiles').select('*').eq('id', s.data.session.user.id).single();
  if (p.error || !p.data || !p.data.aktif){ await sb.auth.signOut(); return showLogin('Akun belum terdaftar atau tidak aktif. Hubungi admin.'); }
  S.me = p.data; S.email = s.data.session.user.email;
  S.tab = S.me.role === 'dpjp' ? 'klar' : 'pasien';
  S.view = 'list';
  await muatDpjp();
  sinkronPush();
  render();
}
async function muatDpjp(){
  if (S.me.role === 'dpjp') return;
  var d = await sb.from('profiles').select('id,nama,wa_nomor').eq('role','dpjp').eq('aktif',true).order('nama');
  S.dpjps = d.data || [];
}

async function render(){
  app.innerHTML = '<main><p class="sub">Memuat...</p></main>';
  var v = S.view;
  if (v === 'detail') return viewDetail();
  if (v === 'jawab') return viewJawab();
  if (v === 'tambahPasien') return viewFormPasien(false);
  if (v === 'ubahPasien') return viewFormPasien(true);
  if (v === 'tambahTemuan') return viewTambahTemuan();
  if (v === 'cetak') return viewCetak();
  if (v === 'pengguna') return viewPengguna();
  if (S.tab === 'akun') return viewAkun();
  if (S.me.role === 'dpjp') return viewKlar(S.tab === 'riwayat');
  if (S.tab === 'klar') return viewKlar(false);
  if (S.tab === 'rekap') return viewRekap();
  return viewPasien();
}

// ---------- Daftar pasien ----------
async function viewPasien(){
  var r = await sb.from('pasien').select('*, dpjp:profiles!pasien_dpjp_id_fkey(nama), temuan(id,status,target)').order('created_at',{ascending:false});
  if (r.error) return shell(header('Pasien Prioritas'), '<div class="err">Gagal memuat data.</div>', menu());
  var list = r.data.filter(function(p){
    var open = p.temuan.filter(function(t){ return t.status === 'menunggu'; });
    if (S.filter === 'menunggu') return open.length > 0;
    if (S.filter === 'selesai') return p.status === 'selesai';
    return true;
  });
  var chips = [['semua','Semua'],['menunggu','Menunggu DPJP'],['selesai','Selesai']].map(function(c){
    return '<button class="chip' + (S.filter === c[0] ? ' on' : '') + '" data-filter="' + c[0] + '">' + c[1] + '</button>';
  }).join('');
  var cards = list.map(function(p){
    var open = p.temuan.filter(function(t){ return t.status === 'menunggu'; });
    var late = open.some(terlambat);
    var pill = p.status === 'selesai' ? '<span class="pill p-ok">Selesai</span>' : late ? '<span class="pill p-late">Target terlewat</span>' :
      open.length ? '<span class="pill p-wait">Menunggu DPJP (' + open.length + ')</span>' : '<span class="pill p-info">Proses verifikasi</span>';
    return '<button class="card click" data-pasien="' + p.id + '"><div style="display:flex;justify-content:space-between;gap:8px"><p class="title">' + esc(p.inisial) +
      ' <span class="sub">&middot; RM ' + esc(p.no_rm) + '</span></p><span class="pill p-info">' + esc(p.ruangan) + '</span></div>' +
      '<p class="sub">' + esc(p.kondisi || '') + (p.dpjp ? ' &middot; DPJP ' + esc(p.dpjp.nama) : '') + '</p><div>' + pill + '</div></button>';
  }).join('') || '<p class="sub">Belum ada pasien.</p>';
  shell(header('Pasien Prioritas', new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})),
    '<div class="chips">' + chips + '</div>' + cards + '<button class="btn sec" data-act="tambahPasien">+ Tambah pasien</button>', menu());
}

// ---------- Form pasien (tambah / ubah) ----------
async function viewFormPasien(edit){
  var p = {};
  if (edit){ var r = await sb.from('pasien').select('*').eq('id', S.pasienId).single(); p = r.data || {}; }
  var opts = S.dpjps.map(function(d){ return '<option value="' + d.id + '"' + (d.id === p.dpjp_id ? ' selected' : '') + '>' + esc(d.nama) + '</option>'; }).join('');
  function fld(id, lab, val, extra){ return '<div class="f"><label for="' + id + '">' + lab + '</label><input id="' + id + '" value="' + esc(val || '') + '" ' + (extra || '') + '></div>'; }
  shell(header(edit ? 'Ubah Data Pasien' : 'Tambah Pasien', 'Hanya inisial dan No. RM. Jangan isi nama lengkap, NIK, atau alamat.', true),
    '<form id="pf" class="card">' + fld('rm','No. RM',p.no_rm,'required') + fld('in','Inisial pasien',p.inisial,'required maxlength="12" placeholder="contoh: Tn. A.S."') +
    fld('rg','Ruangan',p.ruangan,'required placeholder="contoh: ICU"') +
    '<div class="f"><label for="dp">DPJP</label><select id="dp"><option value="">Pilih DPJP</option>' + opts + '</select></div>' +
    fld('kd','Kondisi / alasan prioritas',p.kondisi,'placeholder="contoh: Ventilator hari ke-3"') +
    '<div class="row2"><div class="f"><label for="tm">Tanggal masuk</label><input id="tm" type="date" value="' + esc(p.tgl_masuk || '') + '"></div>' +

    return '<div class="card" data-baru="' + x.id + '"><p class="title">' + esc(x.email) + '</p><p class="sub">Belum diberi peran</p>' +
      '<div class="f"><label>Nama tampil<input data-f="nama" placeholder="contoh: dr. B"></label></div>' +
      '<div class="f"><label>Peran<select data-f="role">' + roleOpt('dpjp') + '</select></label></div>' +
      '<div class="f"><label>Nomor WhatsApp (opsional)<input data-f="wa" type="tel"></label></div>' +
      '<button class="btn sm" data-daftar="' + x.id + '">Daftarkan</button></div>';
  }).join('') || '<p class="sub">Tidak ada akun baru. Buat akun login di Supabase (Authentication &gt; Users) terlebih dulu.</p>';
  var kartuAda = (p.data || []).map(function(x){
    var diri = x.id === S.me.id;
    return '<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><p class="title">' + esc(x.nama) + '</p>' + (x.aktif ? '<span class="pill p-ok">Aktif</span>' : '<span class="pill p-late">Nonaktif</span>') + '</div>' +
      '<p class="sub">' + esc(email[x.id] || '') + '</p>' +
      '<div class="f"><label>Peran<select data-roleid="' + x.id + '"' + (diri ? ' disabled' : '') + '>' + roleOpt(x.role) + '</select></label></div>' +
      (diri ? '<p class="sub">Akun Anda sendiri tidak bisa diubah di sini.</p>' : '<button class="btn sec sm" data-aktif="' + x.id + ':' + (x.aktif ? 'false' : 'true') + '">' + (x.aktif ? 'Nonaktifkan' : 'Aktifkan kembali') + '</button>') + '</div>';
  }).join('');
  shell(header('Kelola Pengguna', 'Hanya admin', true),
    (msg ? '<div class="' + (msg.ok ? 'ok' : 'err') + '" role="status">' + esc(msg.t) + '</div>' : '') +
    '<h2 class="title">Akun menunggu peran</h2>' + kartuBaru + '<h2 class="title">Pengguna terdaftar</h2>' + kartuAda);
}

// ---------- Klik dan perubahan ----------
document.addEventListener('click', async function(e){
  var el = e.target.closest('[data-tab],[data-filter],[data-pasien],[data-jawab],[data-selesai],[data-act],[data-ck],[data-jadi],[data-daftar],[data-aktif]');
  if (!el) return;
  var d = el.dataset;
  if (d.ck){
    var pr = d.ck.split(':'), y = window.scrollY;
    var x = await sb.from('checklist').upsert({ pasien_id: S.pasienId, no: +pr[0], status: pr[1], tgl_visite: S.ckTgl }, { onConflict: 'pasien_id,no,tgl_visite' });
    if (x.error) return alert('Gagal menyimpan: ' + x.error.message);
    await render(); window.scrollTo(0, y); return;
  }
  if (d.jadi){
    var no = +d.jadi, cat = (document.querySelector('[data-ckcat="' + no + '"]') || {}).value || '';
    S.prefill = { aspek: 'Checklist no. ' + no, uraian: CHECK[no - 1] + (cat ? ' - ' + cat : '') };
    S.view = 'tambahTemuan'; return render();
  }
  if (d.daftar){
    var card = el.closest('[data-baru]');
    var nama = card.querySelector('[data-f=nama]').value.trim();
    if (!nama) return alert('Isi nama tampil dulu.');
    var xi = await sb.from('profiles').insert({ id: d.daftar, nama: nama, role: card.querySelector('[data-f=role]').value, wa_nomor: card.querySelector('[data-f=wa]').value.trim() || null });
    if (xi.error) return alert('Gagal: ' + xi.error.message);
    await muatDpjp(); return viewPengguna({ ok: true, t: 'Pengguna didaftarkan.' });
  }
  if (d.aktif){
    var q = d.aktif.split(':');
    var xa = await sb.from('profiles').update({ aktif: q[1] === 'true' }).eq('id', q[0]);
    if (xa.error) return alert('Gagal: ' + xa.error.message);
    await muatDpjp(); return viewPengguna();
  }
  if (d.tab){ S.tab = d.tab; S.view = 'list'; return render(); }
  if (d.filter){ S.filter = d.filter; return render(); }
  if (d.pasien){ S.pasienId = d.pasien; S.view = 'detail'; return render(); }
  if (d.jawab){ S.temuanId = d.jawab; S.view = 'jawab'; return render(); }
  if (d.selesai){ await sb.from('temuan').update({ status:'selesai' }).eq('id', d.selesai); return render(); }
  var a = d.act;
  if (a === 'back'){
    if (S.view === 'tambahTemuan') S.prefill = null;
    S.view = (S.view === 'tambahTemuan' || S.view === 'cetak' || S.view === 'ubahPasien') ? 'detail' : 'list';
    if (S.view === 'list' && el.closest('header') && S.tab === 'akun') S.tab = 'akun';
    return render();
  }
  if (a === 'tambahPasien'){ S.view = 'tambahPasien'; return render(); }
  if (a === 'ubahPasien'){ S.view = 'ubahPasien'; return render(); }
  if (a === 'tambahTemuan'){ S.view = 'tambahTemuan'; return render(); }
  if (a === 'cetak'){ S.view = 'cetak'; return render(); }
  if (a === 'pengguna'){ S.view = 'pengguna'; return render(); }
  if (a === 'printnow'){ return window.print(); }
  if (a === 'pushOn'){ var m = await aktifkanPush(); return viewAkun(m ? { t: m } : { ok: true, t: 'Notifikasi diaktifkan di perangkat ini.' }); }
  if (a === 'pushOff'){ await matikanPush(); return viewAkun({ ok: true, t: 'Notifikasi dimatikan.' }); }
  if (a === 'selesaiPasien'){ await sb.from('pasien').update({ status:'selesai' }).eq('id', S.pasienId); S.view = 'list'; return render(); }
  if (a === 'keluar'){ await lepasPushLokal(); await sb.auth.signOut(); S.me = null; return showLogin(); }
});

document.addEventListener('change', async function(e){
  var t = e.target;
  if (t.dataset && t.dataset.ckcat){
    var x = await sb.from('checklist').update({ catatan: t.value.trim() || null }).eq('pasien_id', S.pasienId).eq('no', +t.dataset.ckcat).eq('tgl_visite', S.ckTgl);
    if (x.error) alert('Gagal menyimpan catatan: ' + x.error.message);
  } else if (t.dataset && t.dataset.cktgl){
    if (t.value){ S.ckTgl = t.value; render(); }
  } else if (t.dataset && t.dataset.roleid){
    var y = await sb.from('profiles').update({ role: t.value }).eq('id', t.dataset.roleid);
    if (y.error) alert('Gagal: ' + y.error.message);
    await muatDpjp();
  }
});

start();
</script>
